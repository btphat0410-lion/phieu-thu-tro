function formatMoneyInput(input){
  const caret=input.selectionStart??input.value.length;
  const digitsBefore=(input.value.slice(0,caret).match(/\d/g)||[]).length;
  const digits=input.value.replace(/\D/g,'');
  input.value=digits?Number(digits).toLocaleString('vi-VN'):'';

  while(nextCaret<input.value.length&&count<digitsBefore){if(/\d/.test(input.value[nextCaret]))count++;nextCaret++}

function settingPaths(value,prefix='',paths=[]){

function applyPendingSettings(target,source){
  const result=Object.assign({},target||{});
  pendingSettings.forEach(path=>{
    const parts=path.split('.');
    let dest=result,src=source||{};
    for(let i=0;i<parts.length-1;i++){
      dest[parts[i]]=Object.assign({},dest[parts[i]]||{});
      dest=dest[parts[i]];src=src&&src[parts[i]];

/* ---- Image shrink ---- */
function shrink(f,maxW=800,q=0.88){return new Promise((ok,no)=>{
  const im=new Image(),u=URL.createObjectURL(f);
  im.onload=()=>{const s=Math.min(1,maxW/im.width),c=document.createElement('canvas');
    c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);
    c.getContext('2d').drawImage(im,0,0,c.width,c.height);
    URL.revokeObjectURL(u);c.toBlob(b=>b?ok(b):no(),'image/jpeg',q)};
  im.onerror=no;im.src=u})}

/* ---- Gemini OCR ---- */
async function readMeterGemini(blob,meterType){
  const b64=await new Promise((ok,no)=>{const fr=new FileReader();fr.onload=()=>ok(fr.result.split(',')[1]);fr.onerror=no;fr.readAsDataURL(blob)});
  const ctrl=new AbortController(),tid=setTimeout(()=>ctrl.abort(),55000);
  try{
    const r=await fetch('/api/read-meter',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({image:b64,meterType}),
      signal:ctrl.signal});
    let data={};
    try{data=await r.json()}catch(e){}
    if(!r.ok)throw{code:'api',status:r.status,error:data.error,message:data.message};
    return data.reading;
  }finally{clearTimeout(tid)}}

/* ---- Number to words ---- */
function words(n){n=Math.round(n);if(!n)return 'Không đồng';
const D=['không','một','hai','ba','bốn','năm','sáu','bảy','tám','chín'],U=['','nghìn','triệu','tỷ'];
const th=(x,f)=>{const h=Math.floor(x/100),t=Math.floor(x%100/10),u=x%10,r=[];
if(h||f)r.push(D[h]+' trăm');
if(t>1){r.push(D[t]+' mươi');r.push(u==1?'mốt':u==5?'lăm':u?D[u]:'')}
else if(t==1){r.push('mười');r.push(u==5?'lăm':u?D[u]:'')}
else if(u){if(h||f)r.push('lẻ');r.push(D[u])}
return r.filter(Boolean).join(' ')};
const g=[];let nn=n;while(nn>0){g.push(nn%1000);nn=Math.floor(nn/1000)}
const o=[];for(let k=g.length-1;k>=0;k--)if(g[k])o.push((th(g[k],k<g.length-1)+' '+U[k]).trim());
const t=o.join(' ')+' đồng';return t[0].toUpperCase()+t.slice(1)}

async function exp(t){
const h=S.hist.find(x=>x.id===cur)||lastRec,name=`phieu-${h.room.replace(/\s+/g,'-')}-${h.m}-${h.y}`;
const box=document.createElement('div');
box.style.cssText='position:fixed;left:-9999px;top:0;z-index:-1;pointer-events:none;';
const n=document.createElement('div');n.className='inv inv-export';n.innerHTML=invHTML(h);
box.appendChild(n);document.body.appendChild(box);
try{
  await Promise.all(Array.from(n.querySelectorAll('img')).map(img=>{
    if(img.complete)return img.naturalWidth?Promise.resolve():Promise.reject(new Error('Không tải được ảnh trên phiếu; kiểm tra kết nối mạng rồi thử lại.'));
    return new Promise((resolve,reject)=>{
      img.addEventListener('load',resolve,{once:true});
      img.addEventListener('error',()=>reject(new Error('Không tải được ảnh trên phiếu; kiểm tra kết nối mạng rồi thử lại.')),{once:true});
    });
  }));
  await(document.fonts&&document.fonts.ready);
  const c=await html2canvas(n,{scale:2,backgroundColor:'#ffffff',useCORS:true,scrollX:0,scrollY:0,width:n.offsetWidth,height:n.offsetHeight});
  if(t==='png'){const b=await new Promise(r=>c.toBlob(r,'image/png'));await saveFile(name+'.png',b)}
  else{const{jsPDF}=window.jspdf,w=105,hh=c.height*w/c.width,d=new jsPDF({unit:'mm',format:[w+10,hh+10]});
    d.addImage(c.toDataURL('image/png'),'PNG',5,5,w,hh);await saveFile(name+'.pdf',d.output('blob'))}
  toast('Đã xuất file!')
}catch(e){toast('Không xuất được file: '+(e&&e.message||'thử lại').slice(0,100))}
finally{box.remove()}}

async function downloadSyncBackup(){
  const data=localStorage.getItem(SYNC_BACKUP_KEY);
  if(!data)return toast('Không có bản sao lưu đồng bộ.');
  await saveFile('tinh-tien-tro-truoc-dong-bo.json',new Blob([data],{type:'application/json'}));
}
function applyCloudData(d,notify=true){
  if(!d||!d.data)return false;
  const next=normalizeCloudData(d.data);
  if(pendingSettings.size)next.set=applyPendingSettings(next.set,S.set||{});
  try{localStorage.setItem('tro_v1',JSON.stringify(next))}
  catch(e){syncPaused=true;showSync('❌ Không đủ chỗ lưu dữ liệu trên máy; đồng bộ đã tạm dừng.',false);return false}
  S=next;fixS();syncExists=true;syncUpdatedAt=d.updated_at||null;syncDirty=pendingSettings.size>0;
  syncRevision++;pendingCloudData=null;render();
  if(syncDirty)queueCloudSave(0);
  if(notify)showSync('☁️ Đã nhận dữ liệu mới từ '+(d.updated_by||'tài khoản khác'));
  return true;
}
async function fetchCloudData(){
  const r=await authFetch('/api/data');
  const d=await r.json();
  if(!r.ok)throw new Error(d.error||r.status);
  return d;
}
function queueCloudSave(delay=900){
  if(!syncReady||syncPaused||(pendingCloudData&&hasUncommittedScreen()))return;
  clearTimeout(syncSaveTimer);
  syncSaveTimer=setTimeout(()=>pushCloud(false),delay);
}
async function resolveCloudConflict(d){
  if(syncConflictOpen)return;
  if(hasUncommittedScreen()){
    if(!pendingCloudData||pendingCloudData.updated_at!==d.updated_at){
      pendingCloudData=d;
      showSync('Có cập nhật mới trên cloud; hãy rời màn hình đang sửa để chọn cách đồng bộ.');
    }
    return;
  }
  syncConflictOpen=true;
  try{
    if(!ensureSyncBackup()){syncPaused=true;return}
    syncExists=!!d.data;syncUpdatedAt=d.updated_at||null;
    const when=d.updated_at?new Date(d.updated_at).toLocaleString('vi-VN'):'?';
    const useCloud=confirm(`Dữ liệu đã được cập nhật ở tài khoản khác (${d.updated_by||'?'}, ${when}).\n\nOK: sao lưu rồi tải dữ liệu cloud.\nHủy: giữ bản trên máy này và tải nó lên cloud.`);
    if(useCloud)applyCloudData(d);
    else{pendingCloudData=null;syncDirty=true;queueCloudSave(0)}
  }finally{syncConflictOpen=false}
}
async function startAutoSync(){
  if(syncStarting||syncReady||syncPaused)return;
  syncStarting=true;
  if(!syncPollTimer)syncPollTimer=setInterval(pollCloud,3000);
  const revisionAtStart=syncRevision,localAtStart=stableStringify(sharedPayload());
  try{
    const d=await fetchCloudData();
    syncReady=true;syncExists=!!(d.has_data||d.data);syncUpdatedAt=d.updated_at||null;
    const changedDuringLoad=syncRevision!==revisionAtStart;
    if(d.data){
      const cloudData=normalizeCloudData(d.data);
      if(pendingSettings.size)cloudData.set=applyPendingSettings(cloudData.set,S.set||{});
      const comparable={...d,data:cloudData};
      const differs=localAtStart!==stableStringify(sharedPayload(cloudData));
      if(differs&&(hasLocalContent()||changedDuringLoad))await resolveCloudConflict(comparable);
      else applyCloudData(comparable,false);
    }else if(hasLocalContent()||changedDuringLoad){
      syncDirty=true;queueCloudSave(0);
    }else showSync('✅ Tự động đồng bộ đang bật');
    lastSyncError='';
  }catch(e){
    const message=e.message||'Không kết nối được cloud';
    if(message!==lastSyncError){showSync('❌ Đồng bộ: '+message.slice(0,70),false);lastSyncError=message}
  }finally{syncStarting=false}
}
async function pollCloud(){
  if(document.hidden||syncPolling||syncBusy||syncPaused)return;
  if(!syncReady){await startAutoSync();return}
  syncPolling=true;
  try{
    const d=await fetchCloudData();
    if(!d.data){lastSyncError='';return}
    const changed=!syncExists||d.updated_at!==syncUpdatedAt;
    if(changed){
      if(syncDirty||hasUncommittedScreen())await resolveCloudConflict(d);
      else applyCloudData(d);
    }
    lastSyncError='';
  }catch(e){
    const message=e.message||'Không kết nối được cloud';
    if(message!==lastSyncError){showSync('❌ Đồng bộ: '+message.slice(0,70),false);lastSyncError=message}
  }finally{syncPolling=false}
}
async function pushCloud(manual=false){
  if(!syncReady){if(manual)showSync('Đang khởi tạo đồng bộ tự động; thử lại sau.',false);return}
  if(syncPaused){if(manual)showSync('Đồng bộ đã tạm dừng. Tải lại ứng dụng để thử lại.',false);return}
  if(syncBusy||(pendingCloudData&&hasUncommittedScreen()))return;
  if(!manual&&!syncDirty)return;
  syncBusy=true;
  const revision=syncRevision;
  const settingsRevision=pendingSettingsRevision;
  try{
    const r=await authFetch('/api/data',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({payload:sharedPayload(),expectedExists:syncExists,expectedUpdatedAt:syncUpdatedAt})});
    const d=await r.json();
    if(r.status===409){
      syncBusy=false;
      let latest;
      try{latest=await fetchCloudData()}
      catch(e){syncReady=false;throw e}
      if(latest.data)await resolveCloudConflict(latest);
      else{syncExists=false;syncUpdatedAt=null;syncDirty=true}
      return;
    }
    if(!r.ok){const e=new Error(d.error||r.status);e.status=r.status;throw e}
    syncExists=true;syncUpdatedAt=d.updated_at;syncDirty=syncRevision!==revision;lastSyncError='';
    if(pendingSettings.size&&settingsRevision===pendingSettingsRevision){
      try{localStorage.removeItem(SETTINGS_PENDING_KEY);pendingSettings.clear()}
      catch(e){showSync('⚠️ Đã đồng bộ, nhưng chưa thể xóa dấu cài đặt chờ.',false)}
    }
    syncRetryDelay=1200;
    if(manual)showSync('✅ Đã lưu lên đám mây');
    else showSync('✅ Đã tự đồng bộ lên đám mây');
  }catch(e){
    const message=e.message||'Không lưu được lên cloud';
    if(message!==lastSyncError){showSync('❌ Lỗi đồng bộ: '+message.slice(0,70),false);lastSyncError=message}
    if(e.status>=400&&e.status<500&&e.status!==429)syncPaused=true;
    else syncRetryDelay=Math.min(syncRetryDelay*2,30000);
  }finally{
    syncBusy=false;
    if(syncDirty&&!syncPaused)queueCloudSave(syncRetryDelay);
  }
}
async function cloudLoad(){
  const btn=document.getElementById('btnLoad');if(btn){btn.disabled=true;btn.textContent='⏳'}
  try{
    const d=await fetchCloudData();
    if(!d.data){showSync('Chưa có dữ liệu trên đám mây',false);return}
    if(!ensureSyncBackup())return;
    const when=d.updated_at?new Date(d.updated_at).toLocaleString('vi-VN'):'?';
    if(!confirm('Tải dữ liệu từ đám mây?\nCập nhật: '+when+'\nBởi: '+(d.updated_by||'?')+'\n\nDữ liệu trên máy này sẽ được sao lưu rồi thay thế.'))return;
    applyCloudData(d);
  }catch(e){showSync('❌ Lỗi tải: '+(e.message||'').slice(0,60),false)}
  finally{if(btn){btn.disabled=false;btn.textContent='☁️ Tải'}}
}
async function cloudSave(){
  const btn=document.getElementById('btnSave');if(btn){btn.disabled=true;btn.textContent='⏳'}
  try{await pushCloud(true)}
  finally{if(btn){btn.disabled=false;btn.textContent='💾 Lưu'}}
}

/* ── User management (Admin only) ────────────────────────────── */
function vUsers(){
  if(!isAdmin()){
    let user={};
    try{user=JSON.parse(localStorage.getItem('tro_user')||'{}')}catch(e){}
    app.innerHTML=`<h1>👤 Tài khoản</h1><div class="mut">Thông tin tài khoản đang đăng nhập</div>
<div class="card"><h2>${esc(user.name||user.username||user.email||'Người dùng')}</h2>
<div class="mut" style="margin-top:6px">${esc(user.username||user.email||'')}</div>
<div class="mut" style="margin-top:10px">Quyền: Người dùng</div></div>
<button class="btn dng" onclick="doLogout()">↩ Đăng xuất</button>`;
    return;
  }
  app.innerHTML=`<h1>👥 Tài khoản</h1><div class="mut">Tạo và quản lý tài khoản cho người dùng</div>
<div class="card" style="background:linear-gradient(135deg,var(--acc),var(--fld))">
<h2>➕ Tạo tài khoản mới</h2>
<label>Tên đăng nhập (3–32 ký tự, chữ/số/._-)</label><input id="nu_username" autocomplete="username" placeholder="thoa">
<label>Tên hiển thị</label><input id="nu_name" placeholder="Nguyễn Văn A">
<label>Mật khẩu</label><input id="nu_pass" type="password" placeholder="Tối thiểu 6 ký tự">
<div class="row" style="margin-top:14px;gap:8px">
<button class="btn" onclick="adminCreate()">Tạo tài khoản</button>
<button class="btn sec" onclick="adminCreate(true)">Tạo Admin</button>
</div>
<div class="warn" id="nu_err"></div></div>
<div id="ulist"><div class="mut" style="text-align:center;padding:20px">Đang tải danh sách…</div></div>`;
  adminList()}

async function adminList(){
  const el=document.getElementById('ulist');if(!el)return;
  try{
    const r=await authFetch('/api/admin');
    const d=await r.json();
    if(!r.ok){el.innerHTML=`<div class="card warn">${esc(d.error||'Lỗi tải danh sách')}</div>`;return}
    const me=JSON.parse(localStorage.getItem('tro_user')||'{}');
    el.innerHTML=`<h2 style="margin:16px 0 4px">Danh sách (${d.users.length})</h2>`+
    d.users.map(u=>`<div class="card"><div class="row sp">
    <div><b>${esc(u.name||u.username||u.email)}</b> ${u.role==='admin'?'<span style="background:var(--pri);color:var(--onpri);border-radius:99px;padding:1px 8px;font-size:11px;font-weight:700">ADMIN</span>':''}
    <div class="mut">${esc(u.username||u.email)}</div>
    <div class="mut" style="font-size:11px">Tạo: ${u.created_at?new Date(u.created_at).toLocaleDateString('vi-VN'):''} · Đăng nhập: ${u.last_sign?new Date(u.last_sign).toLocaleString('vi-VN'):'Chưa bao giờ'}</div></div>
    ${u.id!==me.id?`<div style="display:flex;flex-direction:column;gap:6px">
    <button class="btn sec sm" onclick="adminSetPw('${u.id}','${esc(u.username||u.email)}')">🔑 Đổi mật khẩu</button>
    <button class="btn sec sm" onclick="adminToggleRole('${u.id}','${u.role}','${esc(u.name||u.username||u.email)}')">${u.role==='admin'?'⬇ Hạ user':'⬆ Lên admin'}</button>
    <button class="btn dng sm" onclick="adminDelete('${u.id}','${esc(u.username||u.email)}')">🗑 Xóa</button>
    </div>`:'<span class="mut" style="font-size:12px">(bạn)</span>'}</div></div>`).join('');
  }catch(e){
    el.innerHTML='<div class="card warn">Không kết nối được máy chủ để tải danh sách tài khoản.</div>';
  }
}

async function adminCreate(makeAdmin=false){
  const username=document.getElementById('nu_username').value.trim();
  const name =document.getElementById('nu_name').value.trim();
  const pass =document.getElementById('nu_pass').value;
  const errEl=document.getElementById('nu_err');
  if(!username||!pass){errEl.textContent='Vui lòng nhập đủ tên đăng nhập và mật khẩu.';return}
  errEl.textContent='';
  try{
    const r=await authFetch('/api/admin',{method:'POST',
      headers:{'Content-Type':'application/json'},
      body:JSON.stringify({action:'create',username,password:pass,name,role:makeAdmin?'admin':'user'})});
    const d=await r.json();
    if(!r.ok){errEl.textContent=d.error||'Tạo thất bại';return}
  }catch(e){
    errEl.textContent='Không kết nối được máy chủ. Vui lòng thử lại.';
    return;
  }
  toast('✅ Đã tạo tài khoản: '+username.toLowerCase());
  document.getElementById('nu_username').value='';
  document.getElementById('nu_name').value='';
  document.getElementById('nu_pass').value='';
  adminList();
}

async function adminSetPw(userId, email){
  const pw=prompt(`Mật khẩu mới cho ${email}:\n(tối thiểu 6 ký tự)`);
  if(!pw)return;
  if(pw.length<6){toast('Mật khẩu tối thiểu 6 ký tự',2000);return}
  const r=await authFetch('/api/admin',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'setpw',userId,password:pw})});
  const d=await r.json();
  r.ok?toast('✅ Đã đổi mật khẩu cho '+email):toast('❌ '+d.error);
}

async function adminToggleRole(userId,currentRole,label){
  const newRole=currentRole==='admin'?'user':'admin';
  if(!confirm(`${newRole==='admin'?'Cấp quyền Admin':'Hạ xuống User thường'} cho "${label}"?`))return;
  const r=await authFetch('/api/admin',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'setrole',userId,role:newRole})});
  const d=await r.json();
  if(r.ok){toast('✅ Đã cập nhật quyền');adminList()}else toast('❌ '+d.error);
}

async function adminDelete(userId,email){
  if(!confirm(`Xóa tài khoản "${email}"? Không thể hoàn tác.`))return;
  const r=await authFetch('/api/admin',{method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({action:'delete',userId})});
  const d=await r.json();
  if(r.ok){toast('✅ Đã xóa '+email);adminList()}else toast('❌ '+d.error);
}
/* ────────────────────────────────────────────────────────────── */

render();
startAutoSync();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)pollCloud()});
</script>
